name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: lovenote-jar
          path: build/libs/lovenote-1.0.0.jar
