plugins { id 'fabric-loom' version '1.7-SNAPSHOT' }

group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() maven { url = 'https://maven.fabricmc.net/' } }

sourceSets { main { java { srcDirs = ['.'] include('*.java') } resources { srcDirs = ['.'] include('fabric.mod.json', 'lovenote.mixins.json') } } }

dependencies { minecraft "com.mojang:minecraft:project.minecraftversion"mappings"net.fabricmc:yarn:{project.yarnmappings}:v2" modImplementation "net.fabricmc:fabric-loader:project.loaderversion"modImplementation"net.fabricmc.fabric−api:fabric−api:{project.fabricversion}" }

tasks.withType(JavaCompile).configureEach { options.release = 17 }

java { sourceCompatibility = JavaVersion.VERSION17 targetCompatibility = JavaVersion.VERSION17 }
